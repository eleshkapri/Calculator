<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Cosmic Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- 'C' Loop Gradient -->
    <linearGradient id="cGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- 'V' Infinity Flow Gradient -->
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Accent Equals Glow -->
    <linearGradient id="eqGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Drop Shadow Filters for Depth -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base with Deep Space Gradient -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" />
  
  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="150" cy="160" r="130" fill="#2563eb" fill-opacity="0.18" filter="url(#neonGlow)" />
  <circle cx="360" cy="360" r="120" fill="#a855f7" fill-opacity="0.2" filter="url(#neonGlow)" />

  <!-- Outer Luminous Border Ring -->
  <rect x="6" y="6" width="500" height="500" rx="118" fill="none" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.55" />

  <!-- Main CV Infinity Monogram Group with Shadow -->
  <g filter="url(#softShadow)">

    <!-- 'C' Outer Orbit Arc (Flowing from top-right around to bottom-center) -->
    <path d="M 270 142
             C 170 142, 108 195, 108 270
             C 108 345, 170 398, 260 398
             C 295 398, 328 386, 355 368"
          fill="none"
          stroke="url(#cGrad)"
          stroke-width="36"
          stroke-linecap="round" />

    <!-- 'V' Cosmic Ribbon (Descending into vertex at bottom and ascending to infinity loop) -->
    <path d="M 195 180
             L 282 376
             C 292 398, 318 402, 330 384
             L 404 246
             C 424 208, 412 165, 368 152
             C 328 140, 288 168, 272 208
             L 248 268"
          fill="none"
          stroke="url(#vGrad)"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Intersecting Mobius Accent Knot (Adds 3D ribbon depth) -->
    <path d="M 264 142
             C 230 142, 205 160, 195 180"
          fill="none"
          stroke="#00f2fe"
          stroke-width="36"
          stroke-linecap="round" />

    <!-- Quantum Math Precision Element: Mini Floating Equals Bar -->
    <rect x="156" y="254" width="34" height="10" rx="5" fill="url(#eqGrad)" />
    <rect x="156" y="274" width="34" height="10" rx="5" fill="url(#eqGrad)" />

    <!-- Core Center Luminous Star Sparkle -->
    <g transform="translate(390, 130)">
      <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#ffffff" filter="url(#neonGlow)" />
      <circle cx="0" cy="0" r="3.5" fill="#38bdf8" />
    </g>
  </g>
</svg>
