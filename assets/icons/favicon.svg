<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Vibrant Deep Indigo to Royal Violet) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glassmorphic Card Surface -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>

    <!-- OLED Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Equals Accent Button Gradient -->
    <linearGradient id="equalsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadowDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full Bleed Square Background for 100% Native PWA Maskable Support -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow -->
  <circle cx="256" cy="256" r="190" fill="#38bdf8" fill-opacity="0.12" filter="blur(30px)" />

  <!-- Main Calculator Chassis (Centered in Safe Zone) -->
  <rect x="96" y="72" width="320" height="368" rx="54" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.35" filter="url(#shadowDepth)" />

  <!-- OLED Display Screen -->
  <rect x="126" y="102" width="260" height="82" rx="22" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Screen Glowing Accents (Mini Math Data Line) -->
  <rect x="150" y="126" width="32" height="8" rx="4" fill="#38bdf8" fill-opacity="0.8" />
  <rect x="188" y="126" width="16" height="8" rx="4" fill="#a855f7" fill-opacity="0.8" />
  <rect x="274" y="136" width="92" height="22" rx="6" fill="#38bdf8" />
  <circle cx="258" cy="147" r="4" fill="#34d399" />

  <!-- 4-Quadrant Math Matrix (Clean, Bold, High-Contrast at all resolutions) -->

  <!-- Top-Left Button: PLUS [+] -->
  <rect x="126" y="210" width="118" height="86" rx="22" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />
  <!-- Plus Icon -->
  <path d="M 185 235 L 185 271 M 167 253 L 203 253" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" />

  <!-- Top-Right Button: MINUS [−] -->
  <rect x="268" y="210" width="118" height="86" rx="22" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />
  <!-- Minus Icon -->
  <line x1="309" y1="253" x2="345" y2="253" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" />

  <!-- Bottom-Left Button: MULTIPLY [×] -->
  <rect x="126" y="318" width="118" height="86" rx="22" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />
  <!-- Multiply Icon -->
  <path d="M 172 348 L 198 374 M 198 348 L 172 374" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" />

  <!-- Bottom-Right Button: EQUALS [=] Accent Key -->
  <rect x="268" y="318" width="118" height="86" rx="22" fill="url(#equalsGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" filter="url(#shadowDepth)" />
  <!-- Equals Icon -->
  <line x1="307" y1="353" x2="347" y2="353" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
  <line x1="307" y1="369" x2="347" y2="369" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
</svg>
